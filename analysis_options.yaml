include: package:flutter_lints/flutter.yaml

formatter:
  # The codebase was written at ~100 columns; 80 would cramp the widget trees
  # and the merge logic without making either easier to read.
  page_width: 100

analyzer:
  errors:
    # Generated localizations are committed, so a stale one should fail the
    # build rather than surface as a missing getter at runtime.
    missing_required_param: error
    missing_return: error
  exclude:
    - lib/l10n/app_localizations*.dart
    - "**/*.g.dart"

linter:
  rules:
    # Beyond flutter_lints: these catch real mistakes rather than style.
    - always_declare_return_types
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - collection_methods_unrelated_type
    - implicit_call_tearoffs
    - prefer_final_locals
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_parenthesis
    - use_string_in_part_of_directives
