name: lexi_cards
description: "A spaced-repetition flashcard app (Anki-style, SM-2 algorithm)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Local storage
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # Dependency injection
  get_it: ^8.0.0

  # Navigation
  go_router: ^14.0.0

  # ID generation
  uuid: ^4.5.1
  flutter_quill: ^11.5.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  shared_preferences: ^2.5.5
  flutter_quill_extensions: ^11.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  image: ^4.5.4

  # Google Drive sync
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.11.2
  build_runner: ^2.4.9
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter:

  uses-material-design: true

  # Generates AppLocalizations from lib/l10n/*.arb per l10n.yaml.
  generate: true

  assets:
    - assets/icon/

# Regenerate with: dart run tool/generate_app_icon.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0F6B5C"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
